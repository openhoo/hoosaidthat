name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run pack:check

  orca-image:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install ffmpeg
      - run: docker build --platform linux/amd64 --tag hoosaidthat-orca:dev --file images/orca/Dockerfile .
      - run: CONTAINER_ENGINE=docker bash images/orca/smoke-test.sh hoosaidthat-orca:dev orca
      - run: npm run test:e2e:orca
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: orca-playwright-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  hoovda-image:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: openhoo/hoovda
          ref: 4b9e30dde94a4e832764ef574af5f84242cd82e2
          path: hoovda
      - name: Verify pinned HooVDA source
        run: test "$(git -C hoovda rev-parse HEAD)" = "4b9e30dde94a4e832764ef574af5f84242cd82e2"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install ffmpeg
      - run: docker build --platform linux/amd64 --tag hoovda-engine:dev hoovda
      - run: docker build --platform linux/amd64 --build-arg HOOVDA_IMAGE=hoovda-engine:dev --tag hoosaidthat-hoovda:dev --file images/hoovda/Dockerfile .
      - run: CONTAINER_ENGINE=docker bash images/hoovda/smoke-test.sh hoosaidthat-hoovda:dev
      - run: CONTAINER_ENGINE=docker npm run test:e2e:hoovda
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: hoovda-playwright-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
