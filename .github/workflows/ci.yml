name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run pack:check

  orca-image:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install ffmpeg
      - run: docker build --platform linux/amd64 --tag hoosaidthat-orca:dev --file images/orca/Dockerfile .
      - run: CONTAINER_ENGINE=docker bash images/orca/smoke-test.sh hoosaidthat-orca:dev orca
      - run: npm run test:e2e:orca
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: orca-playwright-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  hoovda-image:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: openhoo/hoovda
          ref: a369caeaf06753a6ccc453c6c8247a1a2ca8b504
          path: hoovda
      - name: Verify pinned HooVDA source
        run: test "$(git -C hoovda rev-parse HEAD)" = "a369caeaf06753a6ccc453c6c8247a1a2ca8b504"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0'
          cache-dependency-path: hoovda/go.sum
      - name: Verify pinned HooVDA oracle
        working-directory: hoovda
        run: go run ./cmd/hoovda conformance --manifest oracle/corpus/manifest.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install ffmpeg
      - run: docker build --platform linux/amd64 --tag hoovda-engine:dev hoovda
      - run: docker build --platform linux/amd64 --build-arg HOOVDA_IMAGE=hoovda-engine:dev --tag hoosaidthat-hoovda:dev --file images/hoovda/Dockerfile .
      - run: CONTAINER_ENGINE=docker bash images/hoovda/smoke-test.sh hoosaidthat-hoovda:dev
      - run: CONTAINER_ENGINE=docker npm run test:e2e:hoovda -- --output test-results/hoovda-en-US-desktop
      - name: Qualify remaining HooVDA locale and keyboard-layout cells
        shell: bash
        env:
          CONTAINER_ENGINE: docker
          SCREEN_READER: hoovda
          SCREEN_READER_IMAGE: hoosaidthat-hoovda:dev
        run: |
          set -euo pipefail
          for matrix in en-US/laptop de-DE/desktop de-DE/laptop; do
            locale=${matrix%/*}
            layout=${matrix#*/}
            SCREEN_READER_LOCALE="$locale" SCREEN_READER_KEYBOARD_LAYOUT="$layout" \
              npx playwright test --config examples/basic/playwright.config.ts \
                --output "test-results/hoovda-${locale}-${layout}" \
                --grep 'matches pinned NVDA aria-details'
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: hoovda-playwright-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
