name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run pack:check

  orca-image:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install ffmpeg
      - run: docker build --platform linux/amd64 --tag hoosaidthat-orca:dev --file images/orca/Dockerfile .
      - run: CONTAINER_ENGINE=docker bash images/orca/smoke-test.sh hoosaidthat-orca:dev orca
      - run: npm run test:e2e:orca
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: orca-playwright-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  hoovda-image:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: openhoo/hoovda
          ref: 64ac5f81af8c7e994dc643e5efbbc5fc8bdbc832
          path: hoovda
      - name: Verify pinned HooVDA source
        run: test "$(git -C hoovda rev-parse HEAD)" = "64ac5f81af8c7e994dc643e5efbbc5fc8bdbc832"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0'
          cache-dependency-path: hoovda/go.sum
      - name: Verify pinned HooVDA source and oracle
        working-directory: hoovda
        run: |
          go generate ./internal/atspi
          git diff --exit-code -- internal/atspi/zz_generated_interfaces.go
          go test -race ./...
          go vet ./...
          go run ./cmd/hoovda conformance --manifest oracle/corpus/manifest.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install ffmpeg
      - run: docker build --platform linux/amd64 --tag hoovda-engine:dev hoovda
      - run: docker build --platform linux/amd64 --build-arg HOOVDA_IMAGE=hoovda-engine:dev --tag hoosaidthat-hoovda:dev --file images/hoovda/Dockerfile .
      - run: CONTAINER_ENGINE=docker bash images/hoovda/smoke-test.sh hoosaidthat-hoovda:dev
      - name: Qualify complete HooVDA command surface
        env:
          CONTAINER_ENGINE: docker
          SCREEN_READER_IMAGE: hoosaidthat-hoovda:dev
          KEEP_SCREEN_READER_CONTAINER: '1'
        run: node scripts/hoovda-parity.mjs en-US desktop
      - name: Print retained HooVDA diagnostics
        if: failure()
        shell: bash
        run: |
          set -u
          logs="$RUNNER_TEMP/hoovda-diagnostics"
          mkdir -p "$logs"
          while IFS= read -r container; do
            destination="$logs/${container}.log"
            if docker cp "$container:/tmp/hoosaidthat-runtime/logs/hoovda.stderr.log" "$destination"; then
              echo "===== $container ====="
              tail -n 500 "$destination"
            fi
          done < <(docker ps --all --filter label=dev.hoosaidthat.managed=true --format '{{.Names}}')
      - name: Remove retained HooVDA containers
        if: always()
        shell: bash
        run: |
          docker ps --all --quiet --filter label=dev.hoosaidthat.managed=true \
            | xargs --no-run-if-empty docker rm --force
      - run: CONTAINER_ENGINE=docker npm run test:e2e:hoovda -- --output test-results/hoovda-en-US-desktop
      - name: Qualify remaining complete HooVDA parity cells
        shell: bash
        env:
          CONTAINER_ENGINE: docker
          SCREEN_READER_IMAGE: hoosaidthat-hoovda:dev
        run: |
          set -euo pipefail
          for matrix in en-US/laptop de-DE/desktop de-DE/laptop; do
            locale=${matrix%/*}
            layout=${matrix#*/}
            node scripts/hoovda-parity.mjs "$locale" "$layout"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: hoovda-playwright-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
