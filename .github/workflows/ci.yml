name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run pack:check

  orca-image:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker build --platform linux/amd64 --tag hoosaidthat-orca:dev --file images/orca/Dockerfile .
      - run: CONTAINER_ENGINE=docker bash images/orca/smoke-test.sh hoosaidthat-orca:dev orca
      - run: npm run test:e2e:orca
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: orca-playwright-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
