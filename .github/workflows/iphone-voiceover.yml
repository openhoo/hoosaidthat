name: iPhone VoiceOver

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/iphone-voiceover.yml'
      - 'oracle/ios-voiceover/**'
      - 'scripts/voiceover-ios.mjs'
      - 'scripts/native/ios-recording.mjs'
      - 'scripts/tests/ios-voiceover.test.mjs'

permissions:
  contents: read

jobs:
  safari:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      HST_IOS_VERSION: '27.0'
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Select the iPhone 18 Pro on this disposable runner
        run: |
          node scripts/voiceover-ios.mjs doctor
          phone=$(xcrun simctl list -j | jq -er --arg runtimeVersion "$HST_IOS_VERSION" '
            . as $list | [.runtimes[] | select(.isAvailable and .platform == "iOS" and .version == $runtimeVersion)
            | .identifier as $runtime | $list.devices[$runtime][]?
            | select(.isAvailable and .deviceTypeIdentifier == "com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro")][0].udid')
          echo "Testing iPhone 18 Pro on iOS $HST_IOS_VERSION ($phone)"
          echo "HST_PHONE=$phone" >> "$GITHUB_ENV"
      - name: Install an isolated simulator audio loopback on the disposable Mac
        run: |
          command -v ffmpeg || brew install ffmpeg
          brew install switchaudio-osx
          brew install --cask blackhole-2ch
          sudo killall coreaudiod || true
          for attempt in {1..20}; do
            system_profiler SPAudioDataType -json | jq -e 'any(.SPAudioDataType[]._items[]; ._name == "BlackHole 2ch")' && break
            sleep 1
          done
          SwitchAudioSource -t output -s "BlackHole 2ch"
          SwitchAudioSource -t output -c
      - name: Present the test iPhone in Device Hub
        run: |
          xcrun simctl boot "$HST_PHONE"
          xcrun simctl bootstatus "$HST_PHONE"
          open -a "$DEVELOPER_DIR/../Applications/DeviceHub.app" "devices://device/open?id=$HST_PHONE"
      - name: Record and check actual VoiceOver output in Mobile Safari
        run: node scripts/voiceover-ios.mjs record --udid "$HST_PHONE" --audio-device "BlackHole 2ch" --dedicated-mac-output
      - name: Preserve XCTest results and transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iphone-voiceover-results
          path: test-results/ios-voiceover/
          if-no-files-found: warn
          retention-days: 7
