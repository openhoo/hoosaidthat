name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package and image version, without v prefix
        required: true
        type: string
      hoovda_ref:
        description: Full 40-character HooVDA commit containing complete oracle corpus
        required: true
        type: string
      confirm_release:
        description: Stage npm package and publish three GHCR images
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    if: inputs.confirm_release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      HOOVDA_REF: ${{ inputs.hoovda_ref }}
      ENGINE_IMAGE: ghcr.io/openhoo/hoosaidthat-hoovda-engine
      HOOVDA_IMAGE: ghcr.io/openhoo/hoosaidthat-hoovda
      ORCA_IMAGE: ghcr.io/openhoo/hoosaidthat-orca
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: openhoo/hoovda
          ref: ${{ inputs.hoovda_ref }}
          path: hoovda
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install pinned npm with staged publishing
        run: npm install --global npm@11.20.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.2'
          cache-dependency-path: hoovda/go.sum
      - name: Validate immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || (( ${#RELEASE_VERSION} > 128 )); then
            echo "version must be valid SemVer, fit an OCI tag, omit build metadata, and have no v prefix" >&2
            exit 1
          fi
          test "$(node -p 'require("./package.json").version')" = "$RELEASE_VERSION"
          test "$GITHUB_REF" = "refs/tags/v${RELEASE_VERSION}"
          test "$(git rev-parse "refs/tags/v${RELEASE_VERSION}^{commit}")" = "$GITHUB_SHA"
          if [[ ! "$HOOVDA_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "hoovda_ref must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi
          test "$(git -C hoovda rev-parse HEAD)" = "$HOOVDA_REF"
      - name: Verify npm publishing identity
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Require unused npm version
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-absence-guards.sh" <<'GUARDS'
          require_unused_npm_version() {
            local package_name public_result stage_result
            package_name=$(node -p 'require("./package.json").name')
            public_result=$(mktemp)
            if npm view "${package_name}@${RELEASE_VERSION}" version --json \
              --registry=https://registry.npmjs.org > "$public_result" 2> "${public_result}.stderr"; then
              echo "npm version already exists; release refused" >&2
              return 1
            fi
            if ! jq -e 'type == "object" and .error.code == "E404"' "$public_result" > /dev/null; then
              echo "Cannot prove npm version is absent; release refused" >&2
              return 1
            fi
            stage_result=$(mktemp)
            if npm stage list "$package_name" --json --registry=https://registry.npmjs.org \
              > "$stage_result" 2> "${stage_result}.stderr"; then
              if ! jq -e --arg package "$package_name" --arg version "$RELEASE_VERSION" \
                'type == "array" and all(.[]; type == "object" and .packageName == $package and (.version | type == "string")) and all(.[]; .version != $version)' \
                "$stage_result" > /dev/null; then
                echo "npm staged version exists or stage listing is invalid; release refused" >&2
                return 1
              fi
            elif ! jq -e 'type == "object" and .error.code == "E404"' "$stage_result" > /dev/null; then
              echo "Cannot prove npm staged version is absent; release refused" >&2
              return 1
            fi
          }
          require_unused_image_tag() {
            local reference=$1 result error
            result=$(mktemp)
            if docker buildx imagetools inspect "$reference" > "$result" 2>&1; then
              echo "Image version tag already exists: $reference; release refused" >&2
              return 1
            fi
            error=$(cat "$result")
            error=${error#ERROR: }
            case "$error" in
              "$reference: not found"|"$reference: manifest unknown"|"$reference: manifest unknown: manifest unknown"|"manifest unknown") ;;
              *) echo "Cannot prove image version tag is absent: $reference; release refused" >&2; return 1 ;;
            esac
          }
          GUARDS
          source "$RUNNER_TEMP/release-absence-guards.sh"
          require_unused_npm_version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify HooVDA release gate
        working-directory: hoovda
        run: |
          go generate ./internal/atspi
          git diff --exit-code -- internal/atspi/zz_generated_interfaces.go
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          go run ./cmd/hoovda conformance --manifest oracle/corpus/manifest.json
      - name: Verify npm package
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run typecheck
          npm run pack:check
      - name: Authenticate GHCR
        shell: bash
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Buildx builder
        run: docker buildx create --name hoosaidthat-release --use
      - name: Build attested release candidates
        shell: bash
        run: |
          set -euo pipefail
          candidate_tag="candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          hoovda_commit=$(git -C hoovda rev-parse HEAD)
          hoovda_date=$(git -C hoovda show -s --format=%cI HEAD)
          docker buildx build --platform linux/amd64 --push --sbom=true --provenance=mode=max \
            --build-arg "VERSION=${RELEASE_VERSION}" \
            --build-arg "COMMIT=${hoovda_commit}" \
            --build-arg "BUILD_DATE=${hoovda_date}" \
            --metadata-file "$RUNNER_TEMP/hoovda-engine-metadata.json" \
            --tag "${ENGINE_IMAGE}:${candidate_tag}" hoovda
          engine_digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/hoovda-engine-metadata.json")
          docker buildx build --platform linux/amd64 --push --sbom=true --provenance=mode=max \
            --build-arg "HOOVDA_IMAGE=${ENGINE_IMAGE}@${engine_digest}" \
            --build-arg "IMAGE_VERSION=${RELEASE_VERSION}" \
            --metadata-file "$RUNNER_TEMP/hoovda-metadata.json" \
            --tag "${HOOVDA_IMAGE}:${candidate_tag}" \
            --file images/hoovda/Dockerfile .
          hoovda_digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/hoovda-metadata.json")
          docker buildx build --platform linux/amd64 --push --sbom=true --provenance=mode=max \
            --build-arg "IMAGE_VERSION=${RELEASE_VERSION}" \
            --metadata-file "$RUNNER_TEMP/orca-metadata.json" \
            --tag "${ORCA_IMAGE}:${candidate_tag}" \
            --file images/orca/Dockerfile .
          orca_digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/orca-metadata.json")
          {
            printf 'ENGINE_CANDIDATE=%s@%s\n' "$ENGINE_IMAGE" "$engine_digest"
            printf 'HOOVDA_CANDIDATE=%s@%s\n' "$HOOVDA_IMAGE" "$hoovda_digest"
            printf 'ORCA_CANDIDATE=%s@%s\n' "$ORCA_IMAGE" "$orca_digest"
          } >> "$GITHUB_ENV"
          mkdir -p test-results
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg sourceRef "$GITHUB_REF" \
            --arg sourceCommit "$GITHUB_SHA" --arg companionCommit "$hoovda_commit" \
            --arg version "$RELEASE_VERSION" --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg runUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg candidateTag "$candidate_tag" \
            --arg engineImage "$ENGINE_IMAGE" --arg engineDigest "$engine_digest" \
            --arg hoovdaImage "$HOOVDA_IMAGE" --arg hoovdaDigest "$hoovda_digest" \
            --arg orcaImage "$ORCA_IMAGE" --arg orcaDigest "$orca_digest" \
            '{schemaVersion: 1, repository: $repository, sourceRef: $sourceRef,
              sourceCommit: $sourceCommit, companionRepository: "openhoo/hoovda",
              companionCommit: $companionCommit, version: $version,
              run: {id: $runId, attempt: $runAttempt, url: $runUrl},
              images: [
                {name: "engine", candidateTag: ($engineImage + ":" + $candidateTag),
                  reference: ($engineImage + "@" + $engineDigest), digest: $engineDigest,
                  versionTag: ($engineImage + ":" + $version)},
                {name: "hoovda", candidateTag: ($hoovdaImage + ":" + $candidateTag),
                  reference: ($hoovdaImage + "@" + $hoovdaDigest), digest: $hoovdaDigest,
                  versionTag: ($hoovdaImage + ":" + $version)},
                {name: "orca", candidateTag: ($orcaImage + ":" + $candidateTag),
                  reference: ($orcaImage + "@" + $orcaDigest), digest: $orcaDigest,
                  versionTag: ($orcaImage + ":" + $version)}]}' \
            > test-results/release-candidates.json
      - name: Qualify release candidates
        env:
          CONTAINER_ENGINE: docker
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$HOOVDA_CANDIDATE"
          docker tag "$(docker image inspect --format '{{.Id}}' "$HOOVDA_CANDIDATE")" hoosaidthat-hoovda:release
          docker pull --platform linux/amd64 "$ORCA_CANDIDATE"
          docker tag "$(docker image inspect --format '{{.Id}}' "$ORCA_CANDIDATE")" hoosaidthat-orca:release
          npx playwright install --with-deps chromium ffmpeg
          npm run test:session-browser
          npm run test:report-edges -- test-results/report-edges
          bash images/hoovda/smoke-test.sh hoosaidthat-hoovda:release
          bash images/orca/smoke-test.sh hoosaidthat-orca:release orca
          for matrix in en-US/desktop en-US/laptop de-DE/desktop de-DE/laptop; do
            locale=${matrix%/*}
            layout=${matrix#*/}
            CONTAINER_ENGINE=docker SCREEN_READER_IMAGE=hoosaidthat-hoovda:release \
              node scripts/hoovda-parity.mjs "$locale" "$layout"
          done
          SCREEN_READER=hoovda SCREEN_READER_IMAGE=hoosaidthat-hoovda:release \
            npx playwright test --config examples/basic/playwright.config.ts \
              --output test-results/hoovda-en-US-desktop
          for matrix in en-US/laptop de-DE/desktop de-DE/laptop; do
            locale=${matrix%/*}
            layout=${matrix#*/}
            SCREEN_READER=hoovda SCREEN_READER_IMAGE=hoosaidthat-hoovda:release \
              SCREEN_READER_LOCALE="$locale" SCREEN_READER_KEYBOARD_LAYOUT="$layout" \
              npx playwright test --config examples/basic/playwright.config.ts \
                --output "test-results/hoovda-${locale}-${layout}" \
                --grep 'matches pinned NVDA aria-details'
          done
          SCREEN_READER=orca SCREEN_READER_IMAGE=hoosaidthat-orca:release \
            npx playwright test --config examples/basic/playwright.config.ts \
              --output test-results/orca
          SCREEN_READER_IMAGE=hoosaidthat-hoovda:release \
            npm run test:e2e:report -- --output test-results/report-candidate
          for report in test-results/report-candidate/*/screenreader/screen-reader-report.html; do
            test -f "$report"
            node scripts/verify-web-report.mjs "$report" test-results/report-viewer
          done
      - name: Require unused publication destinations
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-absence-guards.sh"
          require_unused_npm_version
          require_unused_image_tag "${ENGINE_IMAGE}:${RELEASE_VERSION}"
          require_unused_image_tag "${HOOVDA_IMAGE}:${RELEASE_VERSION}"
          require_unused_image_tag "${ORCA_IMAGE}:${RELEASE_VERSION}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Promote qualified image manifests
        shell: bash
        run: |
          set -euo pipefail
          promote() {
            source_ref=$1
            destination_ref=$2
            expected_digest=${source_ref##*@}
            docker buildx imagetools create --tag "$destination_ref" "$source_ref"
            actual_digest=$(docker buildx imagetools inspect "$destination_ref" | awk '$1 == "Digest:" { print $2; exit }')
            test "$actual_digest" = "$expected_digest"
          }
          promote "$ENGINE_CANDIDATE" "${ENGINE_IMAGE}:${RELEASE_VERSION}"
          promote "$HOOVDA_CANDIDATE" "${HOOVDA_IMAGE}:${RELEASE_VERSION}"
          promote "$ORCA_CANDIDATE" "${ORCA_IMAGE}:${RELEASE_VERSION}"
      - name: Stage npm package with provenance
        shell: bash
        run: |
          set -euo pipefail
          npm_tag=latest
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            npm_tag=next
          fi
          npm stage publish --access public --provenance --tag "$npm_tag" --json \
            > "$RUNNER_TEMP/npm-stage-raw.json"
          export NPM_RELEASE_TAG="$npm_tag"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const { name } = JSON.parse(readFileSync('package.json', 'utf8'));
          const raw = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/npm-stage-raw.json`, 'utf8'));
          const item = raw[name];
          if (!item || item.name !== name || item.version !== process.env.RELEASE_VERSION ||
              item.id !== `${name}@${process.env.RELEASE_VERSION}` ||
              typeof item.stageId !== 'string' ||
              !/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(item.stageId) ||
              typeof item.shasum !== 'string' || !/^[0-9a-f]{40}$/.test(item.shasum) ||
              typeof item.integrity !== 'string' || !/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(item.integrity)) {
            throw new Error('npm stage receipt does not match the release identity');
          }
          const receipt = {
            schemaVersion: 1,
            repository: process.env.GITHUB_REPOSITORY,
            sourceRef: process.env.GITHUB_REF,
            sourceCommit: process.env.GITHUB_SHA,
            companionCommit: process.env.HOOVDA_REF,
            run: { id: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT },
            provenanceRequested: true,
            package: { id: item.id, name: item.name, version: item.version,
              stageId: item.stageId, tag: process.env.NPM_RELEASE_TAG,
              shasum: item.shasum, integrity: item.integrity },
          };
          for (const key of ['size', 'unpackedSize', 'entryCount']) {
            if (!Number.isSafeInteger(item[key]) || item[key] < 0) {
              throw new Error(`npm stage receipt has invalid ${key}`);
            }
            receipt.package[key] = item[key];
          }
          writeFileSync('test-results/npm-stage-receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Preserve release qualification and publication receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: release-qualification-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve Buildx attestation metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: release-buildx-metadata
          path: |
            ${{ runner.temp }}/hoovda-engine-metadata.json
            ${{ runner.temp }}/hoovda-metadata.json
            ${{ runner.temp }}/orca-metadata.json
          if-no-files-found: ignore
          retention-days: 30
