name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package and image version, without v prefix
        required: true
        type: string
      hoovda_ref:
        description: Full 40-character HooVDA commit containing complete oracle corpus
        required: true
        type: string
      expected_package_sha256:
        description: SHA-256 of the qualified npm archive (required to publish or stage)
        required: false
        type: string
      npm_publish_mode:
        description: Trusted OIDC, bootstrap staging, or npm-only recovery for 0.1.5
        required: true
        default: trusted
        type: choice
        options:
          - trusted
          - bootstrap-stage
          - recover-npm-0.1.5
      expected_recovery_commit:
        description: Reviewed main merge SHA (only for npm-only recovery)
        required: false
        type: string
      rehearsal_candidate:
        description: Existing candidate tag to benchmark without publishing (leave empty for release)
        required: false
        type: string
      confirm_release:
        description: Confirm registry writes for the selected mode
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ inputs.confirm_release && format('release-{0}', inputs.version) || format('rehearsal-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  HOOVDA_REF: ${{ inputs.hoovda_ref }}
  EXPECTED_PACKAGE_SHA256: ${{ inputs.expected_package_sha256 }}
  NPM_PUBLISH_MODE: ${{ inputs.npm_publish_mode }}
  ENGINE_IMAGE: ghcr.io/openhoo/hoosaidthat-hoovda-engine
  HOOVDA_IMAGE: ghcr.io/openhoo/hoosaidthat-hoovda
  ORCA_IMAGE: ghcr.io/openhoo/hoosaidthat-orca

jobs:
  missing-rehearsal-candidate:
    if: "inputs.npm_publish_mode != 'recover-npm-0.1.5' && !inputs.confirm_release && inputs.rehearsal_candidate == ''"
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Specify an existing candidate for a read-only rehearsal or explicitly confirm a release.' >&2
          exit 1

  build:
    if: inputs.confirm_release && inputs.npm_publish_mode != 'recover-npm-0.1.5'
    permissions:
      contents: read
      packages: write
    outputs:
      engine: ${{ steps.images.outputs.engine }}
      hoovda: ${{ steps.images.outputs.hoovda }}
      orca: ${{ steps.images.outputs.orca }}
      bundle: ${{ steps.bundle.outputs.artifact-id }}
      tarball_sha512: ${{ steps.pack.outputs.sha512 }}
      attempt: ${{ steps.images.outputs.attempt }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: openhoo/hoovda
          ref: ${{ inputs.hoovda_ref }}
          path: hoovda
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install pinned npm with trusted publishing
        run: npm install --global npm@11.20.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.4'
          cache-dependency-path: hoovda/go.sum
      - name: Validate immutable release identity
        env:
          REHEARSAL_CANDIDATE: ${{ inputs.rehearsal_candidate }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/release-package-sha256.sh
          require_package_sha256
          test -z "${REHEARSAL_CANDIDATE:-}" || { echo "Cannot publish a rehearsal." >&2; exit 1; }
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || (( ${#RELEASE_VERSION} > 128 )); then
            echo "version must be valid SemVer, fit an OCI tag, omit build metadata, and have no v prefix" >&2
            exit 1
          fi
          test "$(node -p 'require("./package.json").version')" = "$RELEASE_VERSION"
          test "$GITHUB_REF" = "refs/tags/v${RELEASE_VERSION}"
          test "$(git rev-parse "refs/tags/v${RELEASE_VERSION}^{commit}")" = "$GITHUB_SHA"
          if [[ ! "$HOOVDA_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "hoovda_ref must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi
          test "$(git -C hoovda rev-parse HEAD)" = "$HOOVDA_REF"
          test "$(node -p 'require("./images/hoovda/source.json").commit')" = "$HOOVDA_REF"
          case "$NPM_PUBLISH_MODE" in
            trusted|bootstrap-stage) ;;
            *) echo "Unknown npm publishing mode" >&2; exit 1 ;;
          esac
      - name: Verify the pinned HooVDA source against upstream main
        run: npm run hoovda:check
      - name: Verify npm bootstrap identity
        if: inputs.npm_publish_mode == 'bootstrap-stage'
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Require unused npm version
        shell: bash
        run: |
          set -euo pipefail
          source scripts/release-absence-guards.sh
          require_unused_npm_version
        env:
          NODE_AUTH_TOKEN: ${{ inputs.npm_publish_mode == 'bootstrap-stage' && secrets.NPM_TOKEN || '' }}
      - name: Verify HooVDA release gate
        working-directory: hoovda
        run: |
          go generate ./internal/atspi
          git diff --exit-code -- internal/atspi/zz_generated_interfaces.go
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          go run ./cmd/hoovda conformance --manifest oracle/corpus/manifest.json
      - name: Verify npm package
        run: |
          umask 022
          npm ci
          npm audit --audit-level=high
          npm test
          npm run typecheck
          npm run pack:check
      - name: Pack tested npm files
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          source scripts/release-package-sha256.sh
          mkdir -p "$RUNNER_TEMP/bundle"
          package=$(npm pack --json --pack-destination "$RUNNER_TEMP/bundle" | jq -er '.[0].filename')
          mv "$RUNNER_TEMP/bundle/$package" "$RUNNER_TEMP/bundle/package.tgz"
          verify_package_sha256 "$RUNNER_TEMP/bundle/package.tgz"
          printf 'sha512=%s\n' "$(sha512sum "$RUNNER_TEMP/bundle/package.tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Authenticate GHCR
        shell: bash
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Buildx builder
        run: docker buildx create --name hoosaidthat-release --use
      - name: Build attested release candidates
        id: images
        shell: bash
        run: |
          set -euo pipefail
          candidate_tag="candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          hoovda_commit=$(git -C hoovda rev-parse HEAD)
          hoovda_date=$(git -C hoovda show -s --format=%cI HEAD)
          docker buildx build --platform linux/amd64 --push --sbom=true --provenance=mode=max \
            --build-arg "VERSION=${RELEASE_VERSION}" \
            --build-arg "COMMIT=${hoovda_commit}" \
            --build-arg "BUILD_DATE=${hoovda_date}" \
            --metadata-file "$RUNNER_TEMP/hoovda-engine-metadata.json" \
            --tag "${ENGINE_IMAGE}:${candidate_tag}" hoovda
          engine_digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/hoovda-engine-metadata.json")
          docker buildx build --platform linux/amd64 --push --sbom=true --provenance=mode=max \
            --build-arg "HOOVDA_IMAGE=${ENGINE_IMAGE}@${engine_digest}" \
            --build-arg "IMAGE_VERSION=${RELEASE_VERSION}" \
            --build-arg "IMAGE_REVISION=${GITHUB_SHA}" \
            --build-arg "HOOVDA_COMMIT=${hoovda_commit}" \
            --build-arg "BUILD_DATE=$(git show -s --format=%cI HEAD)" \
            --metadata-file "$RUNNER_TEMP/hoovda-metadata.json" \
            --tag "${HOOVDA_IMAGE}:${candidate_tag}" \
            --file images/hoovda/Dockerfile .
          hoovda_digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/hoovda-metadata.json")
          docker buildx build --platform linux/amd64 --push --sbom=true --provenance=mode=max \
            --build-arg "IMAGE_VERSION=${RELEASE_VERSION}" \
            --metadata-file "$RUNNER_TEMP/orca-metadata.json" \
            --tag "${ORCA_IMAGE}:${candidate_tag}" \
            --file images/orca/Dockerfile .
          orca_digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/orca-metadata.json")
          {
            printf 'engine=%s@%s\n' "$ENGINE_IMAGE" "$engine_digest"
            printf 'hoovda=%s@%s\n' "$HOOVDA_IMAGE" "$hoovda_digest"
            printf 'orca=%s@%s\n' "$ORCA_IMAGE" "$orca_digest"
            echo "attempt=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg sourceRef "$GITHUB_REF" \
            --arg sourceCommit "$GITHUB_SHA" --arg companionCommit "$hoovda_commit" \
            --arg version "$RELEASE_VERSION" --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg runUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg candidateTag "$candidate_tag" \
            --arg engineImage "$ENGINE_IMAGE" --arg engineDigest "$engine_digest" \
            --arg hoovdaImage "$HOOVDA_IMAGE" --arg hoovdaDigest "$hoovda_digest" \
            --arg orcaImage "$ORCA_IMAGE" --arg orcaDigest "$orca_digest" \
            '{schemaVersion: 1, repository: $repository, sourceRef: $sourceRef,
              sourceCommit: $sourceCommit, companionRepository: "openhoo/hoovda",
              companionCommit: $companionCommit, version: $version,
              run: {id: $runId, attempt: $runAttempt, url: $runUrl},
              images: [
                {name: "engine", candidateTag: ($engineImage + ":" + $candidateTag),
                  reference: ($engineImage + "@" + $engineDigest), digest: $engineDigest,
                  versionTag: ($engineImage + ":" + $version)},
                {name: "hoovda", candidateTag: ($hoovdaImage + ":" + $candidateTag),
                  reference: ($hoovdaImage + "@" + $hoovdaDigest), digest: $hoovdaDigest,
                  versionTag: ($hoovdaImage + ":" + $version)},
                {name: "orca", candidateTag: ($orcaImage + ":" + $candidateTag),
                  reference: ($orcaImage + "@" + $orcaDigest), digest: $orcaDigest,
                  versionTag: ($orcaImage + ":" + $version)}]}' \
            > "$RUNNER_TEMP/bundle/release-candidates.json"
      - name: Store immutable publication inputs
        id: bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          retention-days: 30
      - name: Preserve Buildx attestation metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-buildx-metadata
          path: |
            ${{ runner.temp }}/hoovda-engine-metadata.json
            ${{ runner.temp }}/hoovda-metadata.json
            ${{ runner.temp }}/orca-metadata.json
          if-no-files-found: error
          retention-days: 30

  qualify:
    needs: build
    uses: ./.github/workflows/qualify-runtime.yml
    with:
      hoovda: ${{ needs.build.outputs.hoovda }}
      orca: ${{ needs.build.outputs.orca }}
      source: ${{ github.sha }}

  publish:
    needs: [build, qualify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      ENGINE_CANDIDATE: ${{ needs.build.outputs.engine }}
      HOOVDA_CANDIDATE: ${{ needs.build.outputs.hoovda }}
      ORCA_CANDIDATE: ${{ needs.build.outputs.orca }}
      TARBALL_SHA512: ${{ needs.build.outputs.tarball_sha512 }}
      BUILD_ATTEMPT: ${{ needs.build.outputs.attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.20.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.bundle }}
          path: ${{ runner.temp }}/bundle
          merge-multiple: true
      - name: Verify publication inputs
        shell: bash
        run: |
          set -euo pipefail
          source scripts/release-package-sha256.sh
          verify_package_sha256 "$RUNNER_TEMP/bundle/package.tgz"
          test "$BUILD_ATTEMPT" = "$GITHUB_RUN_ATTEMPT" || { echo 'Rerun all jobs to qualify this release attempt.' >&2; exit 1; }
          printf '%s  %s\n' "$TARBALL_SHA512" "$RUNNER_TEMP/bundle/package.tgz" | sha512sum -c - >/dev/null
          mkdir -p test-results
          cp "$RUNNER_TEMP/bundle/release-candidates.json" test-results/
          jq -e --arg run "$GITHUB_RUN_ID" --arg attempt "$BUILD_ATTEMPT" --arg sha "$GITHUB_SHA" \
            --arg engine "$ENGINE_CANDIDATE" --arg hoovda "$HOOVDA_CANDIDATE" --arg orca "$ORCA_CANDIDATE" \
            '.run.id == $run and .run.attempt == $attempt and .sourceCommit == $sha and
             ([.images[].reference] == [$engine, $hoovda, $orca])' test-results/release-candidates.json >/dev/null
      - name: Authenticate GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require unused publication destinations
        shell: bash
        run: |
          set -euo pipefail
          source scripts/release-absence-guards.sh
          require_unused_npm_version
          require_unused_image_tag "${ENGINE_IMAGE}:${RELEASE_VERSION}"
          require_unused_image_tag "${HOOVDA_IMAGE}:${RELEASE_VERSION}"
          require_unused_image_tag "${ORCA_IMAGE}:${RELEASE_VERSION}"
        env:
          NODE_AUTH_TOKEN: ${{ inputs.npm_publish_mode == 'bootstrap-stage' && secrets.NPM_TOKEN || '' }}
      - name: Promote qualified image manifests
        shell: bash
        run: |
          set -euo pipefail
          source scripts/release-index-digest.sh
          promote() {
            local source_ref=$1 destination_ref=$2
            docker buildx imagetools create --tag "$destination_ref" "$source_ref"
            verify_index_digest "$destination_ref" "${source_ref##*@}"
          }
          promote "$ENGINE_CANDIDATE" "${ENGINE_IMAGE}:${RELEASE_VERSION}"
          promote "$HOOVDA_CANDIDATE" "${HOOVDA_IMAGE}:${RELEASE_VERSION}"
          promote "$ORCA_CANDIDATE" "${ORCA_IMAGE}:${RELEASE_VERSION}"
      - name: Publish npm package from GitHub Actions with provenance
        shell: bash
        run: |
          set -euo pipefail
          npm_tag=latest
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            npm_tag=next
          fi
          publish_command=(npm publish)
          if [[ "$NPM_PUBLISH_MODE" == bootstrap-stage ]]; then
            publish_command=(npm stage publish)
          else
            publish_command+=(--fetch-retries=0)
          fi
          "${publish_command[@]}" "$RUNNER_TEMP/bundle/package.tgz" --access public --provenance --tag "$npm_tag" --json \
            > "$RUNNER_TEMP/npm-publish-raw.json"
          export NPM_RELEASE_TAG="$npm_tag"
          node scripts/release-receipt.mjs create "$RUNNER_TEMP/npm-publish-raw.json" \
            test-results/npm-publication-receipt.json
          actual_integrity="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/bundle/package.tgz" | openssl base64 -A)"
          jq -e --arg expected "$actual_integrity" '.package.integrity == $expected' test-results/npm-publication-receipt.json >/dev/null
          if [[ "$NPM_PUBLISH_MODE" == bootstrap-stage ]]; then
            echo '### npm package staged; publication requires maintainer MFA approval' >> "$GITHUB_STEP_SUMMARY"
            echo 'Review the sanitized stage receipt in release-qualification-evidence and approve the stage on npmjs.com.' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ inputs.npm_publish_mode == 'bootstrap-stage' && secrets.NPM_TOKEN || '' }}
      - name: Verify public npm integrity and provenance
        if: inputs.npm_publish_mode == 'trusted'
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-public-npm.mjs test-results/npm-publication-receipt.json
          echo "### Verified @openhoo/hoosaidthat@${RELEASE_VERSION} on npm with provenance metadata" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve release qualification and publication receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: release-qualification-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 30

  rehearsal-inputs:
    if: "inputs.npm_publish_mode != 'recover-npm-0.1.5' && !inputs.confirm_release && inputs.rehearsal_candidate != ''"
    runs-on: ubuntu-latest
    outputs:
      hoovda: ${{ steps.refs.outputs.hoovda }}
      orca: ${{ steps.refs.outputs.orca }}
      source: ${{ steps.refs.outputs.source }}
    steps:
      - name: Resolve existing candidate indexes without registry writes
        id: refs
        env:
          CANDIDATE_TAG: ${{ inputs.rehearsal_candidate }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_TAG" =~ ^candidate-([0-9a-f]{40})-[1-9][0-9]*-[1-9][0-9]*$ ]]
          echo "source=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          for pair in "hoovda=$HOOVDA_IMAGE" "orca=$ORCA_IMAGE"; do
            image=${pair#*=}
            digest=$(docker buildx imagetools inspect "$image:$CANDIDATE_TAG" --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')
            printf '%s=%s@%s\n' "${pair%%=*}" "$image" "$digest" >> "$GITHUB_OUTPUT"
          done

  rehearse:
    needs: rehearsal-inputs
    uses: ./.github/workflows/qualify-runtime.yml
    with:
      hoovda: ${{ needs.rehearsal-inputs.outputs.hoovda }}
      orca: ${{ needs.rehearsal-inputs.outputs.orca }}
      source: ${{ needs.rehearsal-inputs.outputs.source }}

  invalid-npm-recovery:
    needs: recover-npm-015
    if: "!cancelled() && inputs.npm_publish_mode == 'recover-npm-0.1.5' && needs.recover-npm-015.result == 'skipped'"
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo '0.1.5 npm recovery requires an explicit first dispatch from the reviewed main merge with its exact release inputs.' >&2
          exit 1

  recover-npm-015:
    if: >-
      inputs.npm_publish_mode == 'recover-npm-0.1.5' && inputs.confirm_release &&
      github.repository == 'openhoo/hoosaidthat' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.sha == inputs.expected_recovery_commit && github.run_attempt == 1 &&
      inputs.version == '0.1.5' && inputs.rehearsal_candidate == '' &&
      inputs.hoovda_ref == '71cae236a506d598c201f15da4d8e7aa118a8ca1' &&
      inputs.expected_package_sha256 == 'b249b33dfb7d46fb6d625d6697e35e8fe32f0da77dbcb84fe36c7af36d2a0c74'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      EXPECTED_RECOVERY_COMMIT: ${{ inputs.expected_recovery_commit }}
      CONFIRM_RELEASE: ${{ inputs.confirm_release }}
      REHEARSAL_CANDIDATE: ${{ inputs.rehearsal_candidate }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify reviewed recovery dispatch and successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/recovery-evidence"
          python3 scripts/recover-npm-015.py dispatch "$RUNNER_TEMP/recovery-evidence/dispatch.json"
      - name: Download and verify original qualification and archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/recover-npm-015.py prepare "$RUNNER_TEMP/original"
          cp "$RUNNER_TEMP/original/"{qualification,release-candidates}.json "$RUNNER_TEMP/recovery-evidence/"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install the pinned publishing CLI
        run: |
          npm install --global --ignore-scripts --registry=https://registry.npmjs.org npm@11.20.0
          test "$(npm --version)" = 11.20.0
      - name: Verify destinations and publish the original npm bytes once
        id: recover
        run: |
          set -euo pipefail
          python3 scripts/recover-npm-015.py destinations "$RUNNER_TEMP/recovery-evidence/destinations.json"
          source scripts/release-package-sha256.sh
          verify_package_sha256 "$RUNNER_TEMP/original/package.tgz"
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          npm publish "$RUNNER_TEMP/original/package.tgz" --fetch-retries=0 --registry=https://registry.npmjs.org \
            --access public --tag latest --provenance --ignore-scripts --json > "$RUNNER_TEMP/npm-publish-raw.json"
      - name: Record the npm response
        env:
          NPM_PUBLISH_MODE: trusted
          NPM_RELEASE_TAG: latest
        run: |
          node scripts/release-receipt.mjs create "$RUNNER_TEMP/npm-publish-raw.json" "$RUNNER_TEMP/recovery-evidence/npm-publication-receipt.json"
          jq -e --slurpfile original "$RUNNER_TEMP/original/qualification.json" \
            '.package.integrity == $original[0].package.integrity' "$RUNNER_TEMP/recovery-evidence/npm-publication-receipt.json" >/dev/null
      - name: Read back npm package and verify recovery provenance
        if: "!cancelled() && steps.recover.outputs.attempted == 'true'"
        run: node scripts/verify-npm-recovery-015.mjs "$RUNNER_TEMP/original" "$RUNNER_TEMP/recovery-evidence"
      - name: Record whether submission was attempted
        if: always()
        env:
          ATTEMPTED: ${{ steps.recover.outputs.attempted }}
          OUTCOME: ${{ steps.recover.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/recovery-evidence"
          jq -n --arg attempted "$ATTEMPTED" --arg outcome "$OUTCOME" \
            '{attempted: ($attempted == "true"), stepOutcome: $outcome}' > "$RUNNER_TEMP/recovery-evidence/submission.json"
      - name: Preserve original qualification and recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-only-0.1.5-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-evidence/
          if-no-files-found: ignore
          retention-days: 30
