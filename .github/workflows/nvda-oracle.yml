name: Real NVDA oracle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-nvda-oracle
  cancel-in-progress: false

jobs:
  parity:
    runs-on: [self-hosted, linux, x64, kvm, nvda-oracle]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx playwright install ffmpeg
      - name: Qualify the retained Windows oracle
        id: oracle
        env:
          HST_NVDA_CONTAINER_ID: ${{ vars.NVDA_ORACLE_CONTAINER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          attempt="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'evidence=%s/qualification/%s\n' "${HST_NVDA_RUNTIME_ROOT:-$HOME/VMs/hoosaidthat-nvda}" "$attempt" >> "$GITHUB_OUTPUT"
          npm run nvda:windows:qualification -- run --candidate "$GITHUB_SHA" --attempt "$attempt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.oracle.outputs.evidence != ''
        with:
          name: real-nvda-playwright-evidence
          # Private operator logs and credentials are never uploaded.
          path: |
            ${{ steps.oracle.outputs.evidence }}/test-results
            ${{ steps.oracle.outputs.evidence }}/blocks.jsonl
            ${{ steps.oracle.outputs.evidence }}/receipt.json
          if-no-files-found: warn
          retention-days: 30
