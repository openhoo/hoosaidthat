<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Physical quick navigation</title>
  </head>
  <body>
    <button>Before choices</button>
    <fieldset>
      <legend>Choose an interpreter</legend>
      <label><input id="automatic" type="radio" name="interpreter" />Automatic translation</label>
      <label><input id="human" type="radio" name="interpreter" checked />Human interpreter</label>
      <label><input id="none" type="radio" name="interpreter" />No interpreter</label>
    </fieldset>
    <button>After choices</button>
  </body>
</html>
