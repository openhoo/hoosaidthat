<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout example</title>
    <style>
      body { max-width: 42rem; margin: 4rem auto; font: 18px/1.5 system-ui; }
      label, input, button { display: block; margin-block: 1rem; }
      input, button { padding: 0.7rem; font: inherit; }
      table { border-collapse: collapse; margin-block: 1rem; }
      th, td { border: 1px solid #777; padding: 0.5rem; text-align: left; }
      img { width: 5rem; height: 5rem; }
    </style>
  </head>
  <body>
    <header><a href="#main">Skip to checkout</a></header>
    <main id="main">
      <h1>Checkout</h1>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" />
      <button type="button" aria-describedby="continue-help">Continue</button>
      <p id="continue-help">Review order before payment</p>
      <section aria-labelledby="summary-heading">
        <h2 id="summary-heading">Order summary</h2>
        <ul>
          <li>Accessibility toolkit</li>
          <li>Container runtime</li>
        </ul>
        <table>
          <caption>Order totals</caption>
          <thead><tr><th scope="col">Item</th><th scope="col">Price</th></tr></thead>
          <tbody><tr><th scope="row">Toolkit</th><td>Free</td></tr></tbody>
        </table>
        <img
          alt="OpenHoo parcel mark"
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%232f6fed'/%3E%3Cpath d='M25 32h50v40H25z' fill='white'/%3E%3Cpath d='M25 32l25 18 25-18' fill='none' stroke='%232f6fed' stroke-width='6'/%3E%3C/svg%3E"
        />
      </section>
      <p id="ordinary-update">Receipt pending</p>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      document.querySelector('button').addEventListener('click', () => {
        document.querySelector('#ordinary-update').textContent = 'Receipt timestamp updated';
        document.querySelector('#status').textContent = 'Order review ready';
      });
    </script>
  </body>
</html>
